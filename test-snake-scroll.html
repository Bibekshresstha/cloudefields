<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Snake Decor Stroke Scroll Test</title>
	<style>
		:root {
			--bg: #0f1115;
			--fg: #e9eef5;
			--accent: #fdfaff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
			background: var(--bg);
			color: var(--fg);
		}

		.section {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 12vh 6vw;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
		}

		.section h2 {
			margin: 0;
			font-size: clamp(2rem, 3vw, 3.5rem);
			letter-spacing: 0.06em;
			text-transform: uppercase;
		}

		.section p {
			max-width: 48rem;
			font-size: clamp(1rem, 1.2vw, 1.2rem);
			opacity: 0.8;
		}

		.snake-layer {
			position: absolute;
			inset: 0;
			pointer-events: none;
			z-index: 1;
		}

		/* .snake-wrap {
			position: sticky;
			top: 0;
			height: 100vh;
			display: grid;
			place-items: center;
		} */

		.snake-wrap svg {
			width: min(900px, 88vw);
			height: auto;
			display: block;
		}

		.content {
			position: relative;
			z-index: 2;
		}
	</style>
</head>
