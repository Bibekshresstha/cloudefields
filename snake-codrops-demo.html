<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake TextPath Scroll Demo</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #fdfcff;
      --accent: #f8d9a0;
      --text-fill: #7c4b1f;
      --text-stroke: #ffffff;
    }
    @font-face {
      font-family: 'BlockPro-Bold';
      src: url('assets/fonts/BlockPro-Bold.woff2') format('woff2'),
      url('assets/fonts/BlockPro-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'BlockPro-Bold';
      src: url('assets/fonts/BlockPro-Bold.otf') format('Open type');
      src: url('assets/fonts/BlockPro-Bold.otf') format('Open type'),
      url('assets/fonts/BlockPro-Bold.woff2') format('woff2'),
      url('assets/fonts/BlockPro-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: auto;
    }

    @font-face {
      font-family: 'BlockPro-Condensed';
      src: url('assets/fonts/BlockPro-Condensed.otf') format('Open type');
      src: url('assets/fonts/BlockPro-Condensed.otf') format('Open type'),
      url('assets/fonts/BlockPro-Condensed.woff2') format('woff2'),
      url('assets/fonts/BlockPro-Condensed.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: auto;
    }

    @font-face {
      font-family: 'BlockPro-ExtraCn';
      src: url('assets/fonts/BlockPro-ExtraCn.otf') format('Open type');
      src: url('assets/fonts/BlockPro-ExtraCn.otf') format('Open type'),
      url('assets/fonts/BlockPro-ExtraCn.woff2') format('woff2'),
      url('assets/fonts/BlockPro-ExtraCn.woff') format('woff');
      font-weight: 300;
      font-style: normal;
      font-display: auto;
    }

    @font-face {
      font-family: 'BlockPro-Regular';
      src: url('assets/fonts/BlockPro-Regular.otf') format('Open type');
      src: url('assets/fonts/BlockPro-Regular.otf') format('Open type'),
      url('assets/fonts/BlockPro-Regular.woff2') format('woff2'),
      url('assets/fonts/BlockPro-Regular.woff') format('woff');
      font-weight: 300;
      font-style: normal;
      font-display: auto;
    }

    @font-face {
      font-family: 'Carlsbad-BoldItalic';
      src: url('assets/fonts/Carlsbad-BoldItalic.otf') format('Open type');
      src: url('assets/fonts/Carlsbad-BoldItalic.otf') format('Open type'),
      url('assets/fonts/Carlsbad-BoldItalic.woff2') format('woff2'),
      url('assets/fonts/Carlsbad-BoldItalic.woff') format('woff');
      font-weight: 700;
      font-style: italic;
      font-display: auto;
    }

    @font-face {
      font-family: 'G2Erika-Mono';
      src: url('assets/fonts/G2Erika-Mono.otf') format('Open type');
      src: url('assets/fonts/G2Erika-Mono.otf') format('Open type'),
      url('assets/fonts/G2Erika-Mono.woff2') format('woff2'),
      url('assets/fonts/G2Erika-Mono.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: auto;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .page {
      position: relative;
      min-height: 100vh;
    }
    .snake-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }
    .snake-wrap {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .snake-wrap svg {
      width: min(1060px, 95vw);
      height: auto;
      display: block;
      overflow: visible;
    }
    .snake-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      mix-blend-mode: screen;
      opacity: 0.92;
    }
    .snake-text svg {
      width: min(1080px, 95vw);
      height: auto;
      overflow: visible;
    }
    .snake-text text {
      fill: var(--text-fill);
      stroke: var(--text-stroke);
      stroke-width: 14px;
      paint-order: stroke;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 1.1px;
      word-spacing: 2px;
    }
    .snake-text textPath {
      font-family: 'BlockPro-Condensed', sans-serif;
      letter-spacing: 5px;
      word-spacing: 8px;
    }
    .snake-text .snake-text-band {
      fill: none;
      stroke: rgba(15, 17, 21, 0.96);
      stroke-width: 58px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .snake-text .scroll-text--bg {
      stroke: #ffffff;
      stroke-width: 36px;
    }
    .snake-guide {
      stroke: rgba(253, 254, 255, 0.18);
      stroke-width: 2.5;
      fill: none;
    }
    .section {
      min-height: 65vw;
      display: grid;
      place-items: center;
      padding: 12vh 6vw;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .section h2 {
      margin: 0 0 14px;
      font-size: clamp(1.8rem, 3vw, 3.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .section p {
      margin: 0;
      max-width: 48rem;
      font-size: clamp(1rem, 1.2vw, 1.2rem);
      opacity: 0.75;
    }
    @media (max-width: 700px) {
      .snake-text text {
        font-size: 34px;
        stroke-width: 12px;
      }
      .snake-text .scroll-text--bg { stroke-width: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .snake-text {
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="snakePage">
    <div class="snake-layer">
      <div class="snake-wrap">
        <div id="snakeSvgHost" aria-hidden="true"></div>
      </div>
      <div class="snake-text" aria-hidden="true">
        <svg viewBox="0 0 1706.1 3750.7">
          <defs>
            <filter id="snakeDistort">
              <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="3" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
          <path id="snakeTextPath" d="" />
          <path id="snakeTextBand" class="snake-text-band" d="" />
          <text class="scroll-text scroll-text--bg" data-speed="1" filter="url(#snakeDistort)">
            <textPath href="#snakeTextPath" startOffset="0%">
              
            </textPath>
          </text>
          <text class="scroll-text" data-speed="1" filter="url(#snakeDistort)">
            <textPath href="#snakeTextPath" startOffset="0%">
              
            </textPath>
          </text>
        </svg>
      </div>
    </div>

    <section class="section" id="section-1">
      <div>
        <h2>Hero Section</h2>
        <p>Scroll to move the text along the snake path.</p>
      </div>
    </section>
    <section class="section" id="section-2">
      <div>
        <h2>At Cloudfields</h2>
        <p>Both text lines should glide as you scroll.</p>
      </div>
    </section>
    <section class="section" id="section-3">
      <div>
        <h2>Section Three</h2>
        <p>The text motion is tied to scroll speed.</p>
      </div>
    </section>
    <section class="section" id="section-4">
      <div>
        <h2>Second Last</h2>
        <p>Subtle distortion increases with faster scroll.</p>
      </div>
    </section>
    <section class="section" id="section-5">
      <div>
        <h2>Last Section</h2>
        <p>Reverse on scroll up.</p>
      </div>
    </section>
  </div>

  <script>
    const isFirefox = navigator.userAgent.toLowerCase().includes('firefox');
    if (isFirefox) {
      document.querySelectorAll('#snakeDistort').forEach((filter) => {
        filter.querySelectorAll('feDisplacementMap').forEach((node) => node.setAttribute('scale', '0'));
      });
    }

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    const setupSnakeTextPath = async () => {
      const [pathSvg, strokeSvg] = await Promise.all([
        fetch('assets/images/snake-path.svg').then((res) => res.text()),
        fetch('assets/images/snake-decor-stroke.svg').then((res) => res.text())
      ]);

      const parser = new DOMParser();
      const pathDoc = parser.parseFromString(pathSvg, 'image/svg+xml');
      const strokeDoc = parser.parseFromString(strokeSvg, 'image/svg+xml');

      const pathEl = pathDoc.querySelector('path');
      const strokeRoot = strokeDoc.querySelector('svg');
      const host = document.getElementById('snakeSvgHost');
      const textPath = document.getElementById('snakeTextPath');
      const textBand = document.getElementById('snakeTextBand');

      if (!pathEl || !strokeRoot || !host || !textPath || !textBand) return;

      textPath.setAttribute('d', pathEl.getAttribute('d') || '');
      textBand.setAttribute('d', pathEl.getAttribute('d') || '');

      const strokePath = strokeRoot.querySelector('.st1-bg');
      if (strokePath) {
        strokePath.classList.add('snake-guide');
      }

      host.innerHTML = '';
      host.appendChild(strokeRoot);

      const textNodes = Array.from(document.querySelectorAll('.scroll-text textPath'));

      let lastY = window.scrollY;
      let speed = 0;
      let rafId = null;
      const sectionStart = document.getElementById('section-2');
      const sectionEnd = document.getElementById('section-5');
      const textLayer = document.querySelector('.snake-text');
      let scrollStart = 0;
      let scrollEnd = 1;
      let offsetStart = 36;
      const middleGap = '\u00A0'.repeat(5);
      const fullText = `AT CLOUDFIELDS${middleGap}${middleGap}${middleGap}WE BELIEVE ICE-CREAM IS MORE THAN A TREAT ${middleGap} IT'S A SPACE FOR IMAGINATION ${middleGap} A PLACE WHERE CRAFT AND CREATIVITY MEET ${middleGap} WHERE FLAVOURS ARE EXPLORED WITH INTENTION ${middleGap} AND ${middleGap} WHERE JOY IS DESIGNED INTO EVERY DETAIL.EVERY CLOUDFIELDS CREATION IS THOUGHTFULLY CRAFTED ${middleGap} FROM THE BALANCE OF FLAVOURS TO THE SHAPE IT TAKES IN YOURS HANDS.`;

      if (pathEl) {
        const totalLen = pathEl.getTotalLength();
        const delta = Math.max(1, totalLen / 1500);
        const samples = 1600;
        let bestLen = 0;
        let bestY = Number.POSITIVE_INFINITY;

        // Prefer a top point where forward motion goes downward.
        for (let i = 0; i <= samples; i += 1) {
          const len = (totalLen * i) / samples;
          const p = pathEl.getPointAtLength(len);
          const pNext = pathEl.getPointAtLength(Math.min(totalLen, len + delta));
          if (pNext.y >= p.y && p.y < bestY) {
            bestY = p.y;
            bestLen = len;
          }
        }

        // Fallback to absolute top point if needed.
        if (!Number.isFinite(bestY)) {
          for (let i = 0; i <= samples; i += 1) {
            const len = (totalLen * i) / samples;
            const p = pathEl.getPointAtLength(len);
            if (p.y < bestY) {
              bestY = p.y;
              bestLen = len;
            }
          }
        }

        offsetStart = (bestLen / totalLen) * 100;
      }

      const updateBounds = () => {
        const viewH = window.innerHeight;
        const startRect = sectionStart.getBoundingClientRect();
        const endRect = sectionEnd.getBoundingClientRect();
        const scrollTop = window.scrollY || window.pageYOffset;
        // Start slightly before section 2.
        scrollStart = startRect.top + scrollTop - viewH * 0.2;
        // Keep tail reveal later so bottom text doesn't appear too early.
        scrollEnd = endRect.top + scrollTop + Math.max(endRect.height - viewH, 1) + viewH * 0.15;
        const maxScroll = Math.max(document.documentElement.scrollHeight - viewH, 1);
        scrollEnd = Math.min(scrollEnd, maxScroll);
        if (scrollEnd <= scrollStart) {
          scrollEnd = scrollStart + viewH;
        }
      };

      const onScroll = () => {
        if (rafId) return;
        rafId = requestAnimationFrame(() => {
          const currentY = window.scrollY;
          const delta = currentY - lastY;
          speed = 0.85 * speed + 0.15 * Math.abs(delta);
          lastY = currentY;

          // Bidirectional mapping: down scroll moves forward, up scroll reverses.
          const progress = clamp((currentY - scrollStart) / (scrollEnd - scrollStart), 0, 1);
          let revealProgress = 0;
          // Speed profile: normal at start/end, faster in middle band.
          if (progress <= 0.2) {
            revealProgress = progress;
          } else if (progress <= 0.4) {
            revealProgress = 0.2 + (progress - 0.2) * 2;
          } else if (progress <= 0.6) {
            revealProgress = 0.6 + (progress - 0.4) * 0.6;
          } else {
            // Requested slower tail speed in the 0.7-0.8+ region.
            revealProgress = 0.6 + (progress - 0.6) * 0.6;
          }
          revealProgress = clamp(revealProgress, 0, 1);
          const inRange = currentY >= scrollStart;
          const visibleChars = inRange ? Math.max(1, Math.floor(fullText.length * revealProgress)) : 0;
          if (textLayer) {
            textLayer.style.opacity = visibleChars > 0 ? '0.92' : '0';
          }
          const visibleText = fullText.slice(0, visibleChars);
          textNodes.forEach((node) => {
            node.setAttribute('startOffset', `${offsetStart}%`);
            node.removeAttribute('lengthAdjust');
            node.removeAttribute('textLength');
            node.textContent = visibleText;
          });

          if (!isFirefox) {
            const scale = clamp(speed * 0.15, 0, 18);
            document.querySelectorAll('feDisplacementMap').forEach((node) => {
              node.setAttribute('scale', scale.toFixed(2));
            });
          }

          rafId = null;
        });
      };

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => {
        updateBounds();
        onScroll();
      });
      updateBounds();
      onScroll();
    };

    setupSnakeTextPath();
  </script>
</body>
</html>
